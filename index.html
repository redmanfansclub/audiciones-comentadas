    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const DEFAULT_SUPABASE_PROJECT_ID = "bbdvflbykohleyctiinj";

        const decodeTaskData = (encoded) => { try { return JSON.parse(decodeURIComponent(atob(encoded))); } catch (e) { return null; } };
        const getStoredAuditions = () => { try { return JSON.parse(localStorage.getItem('audiciones_es_tasks') || '[]'); } catch (e) { return []; } };
        const saveStoredAuditions = (newList) => { try { localStorage.setItem('audiciones_es_tasks', JSON.stringify(newList)); } catch (e) {} };
        const getStoredScores = () => { try { return JSON.parse(localStorage.getItem('audiciones_es_scores') || '[]'); } catch (e) { return []; } };
        const saveStoredScores = (newList) => { try { localStorage.setItem('audiciones_es_scores', JSON.stringify(newList)); } catch (e) {} };

        const normalizeSearch = (str) => {
            if (!str) return '';
            return String(str)
                .toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[º°ª]/g, '')
                .replace(/\s+/g, '')
                .trim();
        };

        const getTaskCodeFromUrl = () => {
            try {
                const params = new URLSearchParams(window.location.search);
                const code = params.get('task');
                if (code) return code;
                const hash = window.location.hash || '';
                if (hash.startsWith('#task/')) return hash.replace('#task/', '');
            } catch (e) {}
            return null;
        };

        const buildStudentUrl = (code) => {
            const base = `${window.location.origin}${window.location.pathname}`;
            return `${base}?task=${encodeURIComponent(code)}`;
        };

        const saveStudentSubmission = (record) => {
            try {
                const list = getStoredScores();
                const filtered = list.filter(r => !(r.student_email?.toLowerCase() === record.student_email?.toLowerCase() && r.audition_id === record.audition_id));
                localStorage.setItem('audiciones_es_scores', JSON.stringify([record, ...filtered]));
            } catch (e) {}
        };

        const extractYouTubeId = (url) => {
            if (!url) return null;
            const trimmed = String(url).trim();
            if (!trimmed) return null;
            if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
            const regExp = /(?:https?:\/\/)?(?:[a-zA-Z0-9-]+\.)?(?:youtube(?:-nocookie)?\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?|shorts|live)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
            const match = trimmed.match(regExp);
            return match ? match[1] : null;
        };

        const getFeedback = (score) => {
            const num = Number(score);
            if (num >= 9) return { title: "¡Sobresaliente!", text: "¡Trabajo excelente! Dominas el vocabulario musical de esta audición. Tu esfuerzo y tu atención a los detalles han dado fruto. ¡Sigue así!" };
            if (num >= 7) return { title: "¡Buen trabajo!", text: "¡Bien hecho! Has conseguido un buen resultado y entiendes la mayor parte del contenido. Con un poco más de esfuerzo y atención puedes llegar a la excelencia. ¡Adelante!" };
            if (num >= 5) return { title: "Aprobado", text: "Has aprobado, pero puedes hacerlo mucho mejor. Tu comprensión todavía es básica y necesitas trabajar más el vocabulario y la precisión. ¡No te conformes con el mínimo!" };
            if (num >= 3) return { title: "Resultado insuficiente", text: "Este resultado no es suficiente. Has cometido demasiados errores y necesitas tomarte el aprendizaje más en serio. Espero una mejora clara en la próxima audición." };
            return { title: "Resultado muy insuficiente", text: "Este resultado no es aceptable. Has demostrado muy poca comprensión del contenido. Espero mucho más esfuerzo, preparación y compromiso por tu parte." };
        };

        const formatScore = (n) => Number(n || 0).toFixed(1).replace('.', ',');

        const standardStudentLevels = ['2º ESO', '3º ESO'];
        const classSearchMatch = (studentClass, query) => {
            const raw = String(studentClass || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[º°ª.]/g, '').replace(/\s+/g, '');
            const q = String(query || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[º°ª.]/g, '').replace(/\s+/g, '');
            if (!q) return false;
            const match = raw.match(/^(\d+)(?:eso|curso|bachillerato|bach)?([a-z]*)/);
            if (!match) return raw.includes(q);
            const level = match[1];
            const group = match[2] || '';
            if (/^[1-3]$/.test(q)) return level === q;
            if (/^[a-z]$/.test(q)) return group.includes(q);
            const parsed = q.match(/^(\d+)(?:eso|curso|bachillerato|bach)?([a-z]*)$/);
            if (parsed) {
                if (level !== parsed[1]) return false;
                const requestedGroups = parsed[2] || '';
                if (!requestedGroups) return true;
                return requestedGroups.split('').some(letter => group.includes(letter));
            }
            return raw.includes(q);
        };

        const getQRBase64 = async (text) => {
            if (!text) return null;
            try {
                const url = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=5&data=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                if (!response.ok) return null;
                const blob = await response.blob();
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(blob);
                });
            } catch (e) {
                console.error("QR generation error:", e);
                return null;
            }
        };

        const playAudioFeedback = (type, score = 10) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                const numScore = Number(score);
                if (type === 'success' && numScore >= 8) {
                    const notes = [{ f: 523.25, t: 0.0, d: 0.15 }, { f: 659.25, t: 0.12, d: 0.15 }, { f: 783.99, t: 0.24, d: 0.15 }, { f: 1046.50, t: 0.36, d: 0.30 }, { f: 783.99, t: 0.60, d: 0.15 }, { f: 1046.50, t: 0.72, d: 0.18 }, { f: 1318.51, t: 0.90, d: 0.22 }, { f: 1567.98, t: 1.12, d: 0.50 }];
                    notes.forEach((note) => {
                        const osc = ctx.createOscillator(); const gain = ctx.createGain();
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(note.f, now + note.t);
                        gain.gain.setValueAtTime(0.18, now + note.t);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(now + note.t); osc.stop(now + note.t + note.d);
                    });
                } else if (type === 'success' && numScore >= 7) {
                    const arpeggio = [{ f: 392.00, t: 0.00, d: 0.22 }, { f: 493.88, t: 0.17, d: 0.22 }, { f: 587.33, t: 0.34, d: 0.22 }, { f: 659.25, t: 0.51, d: 0.25 }, { f: 587.33, t: 0.74, d: 0.22 }, { f: 493.88, t: 0.91, d: 0.22 }, { f: 587.33, t: 1.08, d: 0.22 }, { f: 783.99, t: 1.25, d: 0.50 }];
                    arpeggio.forEach((note) => {
                        const osc = ctx.createOscillator(); const gain = ctx.createGain();
                        osc.type = 'sine'; osc.frequency.setValueAtTime(note.f, now + note.t);
                        gain.gain.setValueAtTime(0.15, now + note.t);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(now + note.t); osc.stop(now + note.t + note.d);
                    });
                } else if (type === 'success' && numScore >= 5) {
                    const gentle = [{f:523.25,t:0,d:0.18},{f:659.25,t:0.2,d:0.2},{f:587.33,t:0.43,d:0.22},{f:659.25,t:0.68,d:0.38}];
                    gentle.forEach(note => { const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.type='sine'; osc.frequency.setValueAtTime(note.f,now+note.t); gain.gain.setValueAtTime(0.10,now+note.t); gain.gain.exponentialRampToValueAtTime(0.001,now+note.t+note.d); osc.connect(gain); gain.connect(ctx.destination); osc.start(now+note.t); osc.stop(now+note.t+note.d); });
                } else {
                    const suspenseSequence = [{ f: 246.94, t: 0.00, d: 0.30 }, { f: 233.08, t: 0.28, d: 0.30 }, { f: 220.00, t: 0.56, d: 0.45 }, { f: 110.00, t: 1.05, d: 0.35 }, { f: 233.08, t: 1.45, d: 0.35 }, { f: 220.00, t: 1.78, d: 0.35 }, { f: 207.65, t: 2.11, d: 0.60 }];
                    suspenseSequence.forEach((note) => {
                        const osc = ctx.createOscillator(); const gain = ctx.createGain();
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(note.f, now + note.t);
                        gain.gain.setValueAtTime(0.14, now + note.t);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(now + note.t); osc.stop(now + note.t + note.d);

                }

            for (const ch of String(seedText)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
            if (h === 0) h = 1;
            const rand = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; };
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }

        const buildGapClue = (words, idx, seed) => {
            const word = words[idx] || '';
            const len = word.length;
            if ([0, 4, 6, 8].includes(idx)) return { type: 'text', parts: [word.charAt(0), ...Array(Math.max(0, len - 1)).fill('_')] };
            if ([1, 3, 5, 9].includes(idx)) return { type: 'text', parts: [...Array(Math.max(0, len - 2)).fill('_'), ...word.slice(-2).split('')] };
            if ([2, 7].includes(idx)) {
                const seen = new Set([wordKey(word)]);
                const others = [];
                seededShuffle(words.filter((w, i) => i !== idx), `${seed}-d-${idx}`).forEach(w => {
                    const k = wordKey(w);
                    if (!seen.has(k)) { seen.add(k); others.push(w); }
                });
                return { type: 'options', options: seededShuffle([word, ...others.slice(0, 2)], `${seed}-o-${idx}`) };

                    const e = (wordMap[k] = wordMap[k] || { w: k, tries: 0, fails: 0 }); e.tries++; if (!w.correct) e.fails++;
                }));
                res.words = Object.values(wordMap).filter(e => e.fails > 0).map(e => ({ ...e, rate: e.fails / e.tries }))
                    .sort((a, b) => b.rate - a.rate || b.fails - a.fails).slice(0, 10);
                res.dist = Array.from({ length: 11 }, (_, i) => filtered.filter(s => Math.min(10, Math.floor(Number(s.score || 0))) === i).length);
                res.months = Object.entries(groupBy(filtered, s => String(s.created_at || '').slice(0, 7))).map(([m, arr]) => ({ m, avg: avgOf(arr), n: arr.length })).sort((a, b) => a.m.localeCompare(b.m));
                return res;
            }, [filtered, styleByCode]);

            const ranking = React.useMemo(() => buildRanking(scores, fGroup, fAud), [scores, fGroup, fAud]);
            const topAll = React.useMemo(() => buildRanking(scores, '', fAud).slice(0, 10), [scores, fAud]);
            // Top 10 de la clase: el grupo elegido arriba; sin grupo, un top 10 por curso
            const topClass = React.useMemo(() => fGroup
                ? [{ label: fGroup, list: buildRanking(scores, fGroup, fAud).slice(0, 10) }]
                : courses.map(c => ({ label: c, list: buildRanking(scores.filter(s => courseOf(s.student_class) === c), '', fAud).slice(0, 10) })),
            [scores, fGroup, fAud, courses]);
            const timeLabel = (d) => d ? new Date(d).toLocaleString(T.locale, { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
            const saveEdit = async () => {
                if (!editing || !editing.name.trim() || !editing.cls.trim()) return;
                setSavingEdit(true);
                const ok = await onEdit(editing.id, { student_name: editing.name.trim(), student_class: editing.cls.trim() });
                setSavingEdit(false);
                if (ok) setEditing(null);
            };
            const MiniRank = ({ list, valueFmt }) => (
                <ol className="space-y-1.5">
                    {list.map((x, i) => (
                        <li key={studentKey(x.s) + i} className="flex items-center gap-2 text-sm">
                            <span className={`w-6 h-6 shrink-0 rounded-full flex items-center justify-center text-[11px] font-black ${i === 0 ? 'bg-amber-400 text-white' : i === 1 ? 'bg-slate-300 text-slate-800' : i === 2 ? 'bg-orange-300 text-white' : 'bg-slate-100 text-slate-600'}`}>{i + 1}</span>
                            <button onClick={() => setProfile(studentKey(x.s))} className="flex-1 min-w-0 text-left truncate font-semibold text-slate-800 hover:underline">{nameOf(x.s)} <span className="font-normal text-slate-500 text-xs">· {x.s.student_class}</span></button>
                            <span className="text-xs font-bold text-slate-700">{valueFmt(x)}</span>
                        </li>
                    ))}
                </ol>
            );

            const resetFilters = () => { setQ(''); setFGroup(''); setFCourse(''); setFAud(''); setFBand(''); setFFrom(''); setFTo(''); };
            const anyFilter = q || fGroup || fCourse || fAud || fBand || fFrom || fTo;
            const monthLabel = (m) => { const [y, mo] = m.split('-'); return new Date(Number(y), Number(mo) - 1, 1).toLocaleDateString(T.locale, { month: 'short' }).replace('.', ''); };
            const dateLabel = (d) => d ? new Date(d).toLocaleDateString(T.locale, { day: '2-digit', month: '2-digit', year: '2-digit' }) : '';
            const scoreClass = (v) => Number(v) >= 8 ? 'bg-emerald-50 text-emerald-700' : Number(v) >= 5 ? 'bg-amber-50 text-amber-700' : 'bg-rose-50 text-rose-700';
            const barColor = (v) => v >= 8 ? 'bg-emerald-500' : v >= 5 ? 'bg-amber-400' : 'bg-rose-500';

            const exportCsv = () => {
                const sep = T.csvSep;
                const cell = (v) => { const t = String(v ?? ''); return (t.includes(sep) || /["\n]/.test(t)) ? `"${t.replace(/"/g, '""')}"` : t; };
                const rows = [T.csvHead].concat(sorted.map(s => [s.student_name, s.student_class, s.student_email, s.auditions?.title, s.auditions?.artist, fmt(s.score), dateLabel(s.created_at)]));
                const csv = '\uFEFF' + rows.map(r => r.map(cell).join(sep)).join('\r\n');
                const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
                const a = document.createElement('a'); a.href = url; a.download = `${T.fileName}_${new Date().toISOString().slice(0, 10)}.csv`;
                document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
            };

            const sel = "px-3 py-2 bg-slate-50 border rounded-xl text-xs font-medium outline-none focus:border-indigo-500 min-w-0";
            const Th = ({ k, label, cls = '' }) => (
                <th className={`py-3.5 px-4 ${cls}`}><button onClick={() => setSort(p => ({ key: k, dir: p.key === k ? -p.dir : (k === 'score' || k === 'date' ? -1 : 1) }))} className="uppercase font-bold hover:text-slate-700 inline-flex items-center gap-1">{label}{sort.key === k ? (sort.dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>
            );
            const profRows = profile ? scores.filter(s => studentKey(s) === profile).sort((a, b) => String(a.created_at).localeCompare(String(b.created_at))) : [];

            return (
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                        <h2 className="text-xl font-bold text-slate-900">{T.title}</h2>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={() => setShowStats(v => !v)} className="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl text-xs font-bold">{showStats ? T.hideStats : T.showStats}</button>
                            <button onClick={() => setHide(v => !v)} className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">{hide ? `👁 ${T.showNames}` : `🙈 ${T.hideNames}`}</button>
                            {sorted.length > 0 && <button onClick={exportCsv} className="px-3 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-xl text-xs font-bold flex items-center gap-1"><Icons.Download /> {T.exportCsv}</button>}
                            {scores.length > 0 && <button onClick={onDeleteAll} title={T.deleteAllTitle} className="px-3 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold flex items-center gap-1"><Icons.Trash /> <span className="hidden sm:inline">{T.deleteAll}</span></button>}
                        </div>
                    </div>

                    {/* Selector único: grupo y audición mandan sobre clasificación, Hall of Fame, estadísticas y tabla */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">
                        <select value={fGroup} onChange={e => setFGroup(e.target.value)} className={`${sel} text-sm font-bold py-2.5`}><option value="">{T.allGroups}</option>{groups.map(g => <option key={g} value={g}>{g}</option>)}</select>
                        <select value={fAud} onChange={e => setFAud(e.target.value)} className={`${sel} text-sm font-bold py-2.5`}><option value="">{T.allAvg}</option>{auds.map(([id, t]) => <option key={id} value={id}>{t}</option>)}</select>
                    </div>

                    {scores.length > 0 && (
                        <div className="rounded-2xl p-4 border-2 border-indigo-200 bg-indigo-50 mb-5">
                            <h3 className="text-base font-black text-slate-900 mb-4">🏁 {T.ranking}{fGroup ? ` · ${fGroup}` : ''}</h3>
                            {ranking.length === 0 ? <p className="text-sm text-slate-400">{T.noData}</p> : (<>
                                <div className="grid grid-cols-3 gap-2 items-end max-w-xl mx-auto mb-4">
                                    {[1, 0, 2].map(pos => { const x = ranking[pos]; if (!x) return <div key={pos}></div>;
                                        const h = ['h-28', 'h-20', 'h-14'][pos]; const medal = ['🥇', '🥈', '🥉'][pos];
                                        const col = ['bg-amber-400', 'bg-slate-300', 'bg-orange-300'][pos];
                                        return (
                                            <button key={pos} onClick={() => setProfile(studentKey(x.s))} className="flex flex-col items-center text-center min-w-0">
                                                <span className="text-3xl">{medal}</span>
                                                <span className="text-sm font-black text-slate-900 truncate max-w-full px-1">{nameOf(x.s)}</span>
                                                <span className="text-[11px] text-slate-500 mb-1">{x.s.student_class}</span>
                                                <div className={`ink-dark w-full ${h} ${col} rounded-t-xl flex flex-col items-center justify-start pt-2 shadow-inner`}>
                                                    <span className="text-xl font-black text-slate-900">{fmt(x.value)}</span>
                                                    <span className="text-[10px] font-bold text-slate-800">{pos + 1}.º</span>
                                                </div>
                                            </button>);
                                    })}
                                </div>
                                {ranking.length > 3 && <ol className={`space-y-1 pr-1 ${rankAll ? '' : 'max-h-[36rem] overflow-y-auto'}`}>
                                    {ranking.slice(3).map((x, i) => (
                                        <li key={i} className="flex items-center gap-3 bg-white rounded-xl px-3 py-2 border border-slate-200">
                                            <span className="w-8 text-right text-sm font-black text-slate-500">{i + 4}.º</span>
                                            <button onClick={() => setProfile(studentKey(x.s))} className="flex-1 min-w-0 text-left text-sm font-semibold text-slate-800 truncate hover:underline">{nameOf(x.s)} <span className="font-normal text-xs text-slate-500">· {x.s.student_class}</span></button>
                                            <div className="hidden sm:block w-28 h-2 rounded-full bg-slate-100 overflow-hidden"><div className={`h-full ${barColor(x.value)}`} style={{ width: `${x.value * 10}%` }}></div></div>
                                            <span className="text-[11px] text-slate-400 w-24 text-right hidden md:block">{fAud ? timeLabel(x.first) : T.entries(x.n)}</span>
                                            <span className={`text-xs font-extrabold px-2 py-0.5 rounded-full ${scoreClass(x.value)}`}>{fmt(x.value)}</span>
                                        </li>))}
                                </ol>}
                                <div className="flex flex-wrap justify-between items-center gap-2 mt-2">
                                    <p className="text-[11px] text-slate-500">{fAud ? T.rankTie : T.rankTieAvg}</p>
                                    {ranking.length > 18 && <button onClick={() => setRankAll(v => !v)} className="text-xs font-bold text-indigo-700 hover:underline">{rankAll ? T.collapse : T.expand(ranking.length)}</button>}
                                </div>
                            </>)}
                        </div>
                    )}

                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-2 mb-2">
                        <div className="relative col-span-2"><span className="absolute left-3 top-2.5 text-slate-400"><Icons.Search /></span><input type="text" placeholder={T.search} value={q} onChange={e => setQ(e.target.value)} className="w-full pl-9 pr-3 py-2 bg-slate-50 border rounded-xl text-xs outline-none focus:border-indigo-500" /></div>
                        <select value={fCourse} onChange={e => setFCourse(e.target.value)} className={sel}><option value="">{T.allCourses}</option>{courses.map(c => <option key={c} value={c}>{c}</option>)}</select>
                        <select value={fBand} onChange={e => setFBand(e.target.value)} className={sel}><option value="">{T.allBands}</option>{Object.entries(T.bands).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select>
                        <div className="col-span-2 lg:col-span-4 flex gap-2 items-center text-[11px] text-slate-500">
                            <span>{T.from}</span><input type="date" value={fFrom} onChange={e => setFFrom(e.target.value)} aria-label={T.from} className={`${sel} flex-1 px-2`} />
                            <span>{T.to}</span><input type="date" value={fTo} onChange={e => setFTo(e.target.value)} aria-label={T.to} className={`${sel} flex-1 px-2`} />
                        </div>
                    </div>
                    {anyFilter && <button onClick={resetFilters} className="text-xs font-bold text-indigo-700 hover:underline mb-3">✕ {T.reset}</button>}

                    {showStats && st && (
                        <div className="space-y-4 my-4">

                            <div className="rounded-2xl p-4 border-2 border-amber-300 bg-amber-50">
                                <h3 className="text-base font-black text-slate-900 mb-3">🌟 {T.hall}</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                    <div className="bg-white rounded-xl p-3 border border-slate-200"><p className="text-xs font-bold uppercase text-slate-500 mb-2">🏅 {T.top5}</p>
                                        {topAll.length ? <MiniRank list={topAll} valueFmt={x => fmt(x.value)} /> : <p className="text-sm text-slate-400">{T.noData}</p>}</div>
                                    <div className="space-y-4">
                                        {topClass.map(tc => (
                                            <div key={tc.label} className="bg-white rounded-xl p-3 border border-slate-200"><p className="text-xs font-bold uppercase text-slate-500 mb-2">🎓 {fGroup ? `${T.top5class} · ${tc.label}` : T.top5course(tc.label)}</p>
                                                {tc.list.length ? <MiniRank list={tc.list} valueFmt={x => fmt(x.value)} /> : <p className="text-sm text-slate-400">{T.noData}</p>}</div>
                                        ))}
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                    {[['👑', T.king, st.king, x => T.kingSub(x.tens)], ['🎯', T.bestAvg, st.bestAvg, x => fmt(x.avg)], ['💪', T.push, st.push, x => fmt(x.avg)]].map(([ic, label, list, sub]) => (
                                        <div key={label} className="bg-white rounded-xl p-3 border border-slate-200">
                                            <p className="text-[11px] font-bold uppercase text-slate-500">{ic} {label}</p>
                                            {label === T.push && list && list.length > 0 && <p className="text-[10px] text-slate-400">{st.pushBelow ? T.below5 : T.lowest5}</p>}
                                            {list && list.length ? (<>
                                                <button onClick={() => setProfile(studentKey(list[0].s))} className="block w-full text-left mt-1 hover:underline">
                                                    <span className="block text-base font-black text-slate-900 truncate">{nameOf(list[0].s)}</span>
                                                    <span className="block text-xs text-slate-500">{list[0].s.student_class} · <b className="text-slate-700">{sub(list[0])}</b></span>
                                                </button>
                                                {list.length > 1 && <div className="mt-2 pt-2 border-t border-slate-200 space-y-1 max-h-72 overflow-y-auto pr-1">
                                                    <p className="text-[10px] font-bold uppercase text-slate-400">{T.runners}</p>
                                                    {list.slice(1).map((x, i) => (
                                                        <button key={i} onClick={() => setProfile(studentKey(x.s))} className="flex w-full justify-between gap-2 text-xs hover:underline">
                                                            <span className="truncate text-slate-700"><b>{i + 2}.</b> {nameOf(x.s)}</span><span className="shrink-0 text-slate-500">{sub(x)}</span>
                                                        </button>))}
                                                </div>}
                                            </>) : <p className="text-sm text-slate-400 mt-1">{T.noData}</p>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                                {[[T.avg, fmt2(st.avg), 'from-indigo-500 to-purple-500'], [T.count, st.n, 'from-emerald-500 to-teal-500'], [T.passRate, `${st.pass} %`, 'from-sky-500 to-blue-500'],
                                  [T.excellent, st.top, 'from-amber-500 to-orange-500'], [T.tens, st.tens, 'from-rose-500 to-pink-500'], [T.hints, `${st.hints} %`, 'from-slate-500 to-slate-600']].map(([l, v, g]) => (
                                    <div key={l} className={`bg-gradient-to-br ${g} text-white p-3 rounded-2xl shadow`}><p className="text-[10px] font-bold uppercase tracking-wider opacity-80">{l}</p><p className="text-2xl font-black mt-1">{v}</p></div>
                                ))}
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                <StatCard title={`🏆 ${T.league}`}>
                                    {st.league.map((x, i) => <StatBar key={x.g} label={x.g} value={x.avg} text={fmt(x.avg)} color={barColor(x.avg)} badge={st.league.length > 1 && i === 0 ? '🏆' : st.league.length > 1 && i === st.league.length - 1 ? '🏮' : ''} />)}
                                    {st.league.length > 1 && <p className="text-[11px] text-slate-500 pt-1">🏆 {T.champion}: <b>{st.league[0].g}</b> · 🏮 {T.lantern}: <b>{st.league[st.league.length - 1].g}</b></p>}
                                </StatCard>
                                <StatCard title={`🎧 ${T.auditions}`}>
                                    {st.auds.length > 1 && <div className="grid grid-cols-2 gap-2 mb-1">
                                        <div className="p-2 rounded-xl bg-emerald-50 border border-emerald-200"><p className="text-[10px] font-bold uppercase text-emerald-700">😊 {T.easiest}</p><p className="text-xs font-bold text-slate-900 truncate">{st.auds[0].title}</p><p className="text-xs text-emerald-700 font-bold">{fmt(st.auds[0].avg)}</p></div>
                                        <div className="p-2 rounded-xl bg-rose-50 border border-rose-200"><p className="text-[10px] font-bold uppercase text-rose-700">😰 {T.hardest}</p><p className="text-xs font-bold text-slate-900 truncate">{st.auds[st.auds.length - 1].title}</p><p className="text-xs text-rose-700 font-bold">{fmt(st.auds[st.auds.length - 1].avg)}</p></div>
                                    </div>}
                                    <div className="max-h-48 overflow-y-auto space-y-2 pr-1">{st.auds.map(x => <StatBar key={x.title} label={x.title} value={x.avg} text={`${fmt(x.avg)} (${x.n})`} color={barColor(x.avg)} />)}</div>
                                </StatCard>
                                <StatCard title={`🎼 ${T.styles}`}>
                                    {st.styles.map(x => <StatBar key={x.theme.id} label={x.theme.label} badge={x.theme.icon} value={x.avg} text={`${fmt(x.avg)} (${x.n})`} color={barColor(x.avg)} />)}
                                </StatCard>
                                <StatCard title={`📝 ${T.words}`} sub={T.wordsSub}>
                                    {st.words.length ? st.words.map(x => <StatBar key={x.w} label={x.w} value={x.rate * 100} max={100} text={`${Math.round(x.rate * 100)} % (${x.fails}/${x.tries})`} color="bg-rose-500" />) : <p className="text-sm text-slate-400">{T.noData}</p>}
                                </StatCard>
                                <StatCard title={`📊 ${T.distribution}`}>
                                    <div className="flex items-end gap-1 h-32 pt-2">
                                        {st.dist.map((c, i) => { const mx = Math.max(...st.dist, 1); return (
                                            <div key={i} className="flex-1 flex flex-col items-center justify-end h-full gap-1">
                                                <span className="text-[10px] font-bold text-slate-600">{c || ''}</span>
                                                <div className={`w-full rounded-t ${barColor(i)}`} style={{ height: `${(c / mx) * 80}%`, minHeight: c ? 4 : 0 }}></div>
                                                <span className="text-[10px] text-slate-500">{i}</span>
                                            </div>); })}
                                    </div>
                                </StatCard>
                                <div className="lg:col-span-2"><StatCard title={`📈 ${T.evolution}`}>
                                    {st.months.length ? <div className="flex items-end gap-2 h-36 pt-2 overflow-x-auto">
                                        {st.months.map(x => (
                                            <div key={x.m} className="min-w-[44px] flex-1 flex flex-col items-center justify-end h-full gap-1">
                                                <span className="text-[10px] font-bold text-slate-700">{fmt(x.avg)}</span>
                                                <div className="w-full max-w-[56px] rounded-t bg-indigo-500" style={{ height: `${(x.avg / 10) * 80}%`, minHeight: 4 }}></div>
                                                <span className="text-[10px] text-slate-500 capitalize">{monthLabel(x.m)}</span>
                                                <span className="text-[9px] text-slate-400">{x.n}</span>
                                            </div>))}
                                    </div> : <p className="text-sm text-slate-400">{T.noData}</p>}
                                </StatCard></div>
                            </div>
                        </div>
                    )}

                    {sorted.length === 0 ? (<p className="text-slate-400 text-center py-10">{scores.length === 0 ? T.empty : T.noMatch}</p>) : (
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm border-collapse">
                                <thead><tr className="border-b text-slate-400 text-xs uppercase bg-slate-50/50">
                                    <Th k="name" label={T.cols[0]} /><Th k="group" label={T.cols[1]} /><Th k="audition" label={T.cols[2]} /><Th k="score" label={T.cols[3]} cls="text-center" /><Th k="date" label={T.cols[4]} /><th className="py-3.5 px-4 text-right">{T.cols[5]}</th>
                                </tr></thead>
                                <tbody>
                                    {sorted.map(s => (
                                        <tr key={s.id} className="border-b border-slate-100 hover:bg-slate-50/30 transition-colors">
                                            <td className="py-3.5 px-4"><button onClick={() => setProfile(studentKey(s))} className="font-bold text-slate-950 hover:underline text-left">{nameOf(s)}</button><p className="text-xs text-slate-400">{hide ? '' : (s.student_email || T.noEmail)}</p></td>
                                            <td className="py-3.5 px-4 font-mono text-xs">{s.student_class}</td>
                                            <td className="py-3.5 px-4 text-slate-600 font-medium">{s.auditions?.title}</td>
                                            <td className="py-3.5 px-4 text-center"><span className={`inline-block font-extrabold text-xs px-2.5 py-1 rounded-full ${scoreClass(s.score)}`}>{fmt(s.score)}/10</span></td>
                                            <td className="py-3.5 px-4 text-xs text-slate-500 whitespace-nowrap">{dateLabel(s.created_at)}</td>
                                            <td className="py-3.5 px-4 text-right space-x-1 whitespace-nowrap">
                                                <button onClick={() => setEditing({ id: s.id, name: s.student_name || '', cls: s.student_class || '', email: s.student_email || '' })} title={T.edit} className="p-2 hover:bg-indigo-50 rounded-lg text-indigo-600 transition-colors">✏️</button>
                                                <button onClick={() => onView(s)} title={T.view} className="p-2 hover:bg-slate-100 rounded-lg text-slate-500 transition-colors"><Icons.Eye /></button>
                                                <button onClick={() => onDelete(s.id)} title={T.del} className="p-2 hover:bg-rose-50 rounded-lg text-rose-600 transition-colors"><Icons.Trash /></button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {editing && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
                                <h3 className="text-lg font-bold text-slate-900">✏️ {T.editTitle}</h3>
                                <p className="text-xs text-slate-500">{editing.email}</p>

                    {profile && profRows.length > 0 && (

                                </div>
                                <div className="space-y-1.5 max-h-52 overflow-y-auto pr-1">
                                    {[...profRows].reverse().map(r => (
                                        <button key={r.id} onClick={() => { setProfile(null); onView(r); }} className="w-full flex justify-between items-center p-2.5 rounded-xl border border-slate-200 text-xs hover:bg-slate-50 text-left">
                                            <span className="font-semibold text-slate-800 truncate">{r.auditions?.title}</span>
                                            <span className="flex items-center gap-2 shrink-0"><span className="text-slate-400">{dateLabel(r.created_at)}</span><span className={`font-extrabold px-2 py-0.5 rounded-full ${scoreClass(r.score)}`}>{fmt(r.score)}</span></span>
                                        </button>

                                </div>
                                <div className="flex justify-end"><button onClick={() => setProfile(null)} className="px-4 py-2 rounded-xl text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200">{T.close}</button></div>
                            </div>

                    )}
                </div>
            );
        };

        const App = () => {
            const initialTaskCode = getTaskCodeFromUrl();
            const recoveryHashPresent = typeof window !== 'undefined' && /type=recovery|access_token=/.test(window.location.hash || '');
            const [view, setView] = useState(initialTaskCode ? 'student-test' : (recoveryHashPresent ? 'reset-password' : 'auth'));
            const [session, setSession] = useState(null);
            const [loading, setLoading] = useState(true);
            const [submitting, setSubmitting] = useState(false);
            const [dashboardTab, setDashboardTab] = useState('create');
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('audition_dark_mode') === 'true');
            const [showAwayWarning, setShowAwayWarning] = useState(false);

            const [supabaseUrl] = useState(DEFAULT_SUPABASE_URL);
            const [supabaseKey] = useState(DEFAULT_SUPABASE_KEY);
            const [supabaseClient, setSupabaseClient] = useState(null);

            const [authEmail, setAuthEmail] = useState('');
            const [authPassword, setAuthPassword] = useState('');
            const [recoveryPassword, setRecoveryPassword] = useState('');
            const [recoveryPasswordConfirm, setRecoveryPasswordConfirm] = useState('');
            const [authMode, setAuthMode] = useState('signin');
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);
            const [deleteAllModal, setDeleteAllModal] = useState(null);
            const [deleteAllConfirmText, setDeleteAllConfirmText] = useState('');
            const [createdTaskModal, setCreatedTaskModal] = useState(null);
            const [lookupModal, setLookupModal] = useState(false);
            const [lookupEmail, setLookupEmail] = useState('');

            const [title, setTitle] = useState('');
            const [artist, setArtist] = useState('');
            const [style, setStyle] = useState('classical');
            const [youtubeUrl, setYoutubeUrl] = useState('');
            const [commentText, setCommentText] = useState('');
            const [taskHints, setTaskHints] = useState(Array(10).fill(''));

            const [auditionsList, setAuditionsList] = useState([]);
            const [scoresList, setScoresList] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [searchTermHistory, setSearchTermHistory] = useState('');
            const [copiedId, setCopiedId] = useState(null);
            const [selectedScoreDetails, setSelectedScoreDetails] = useState(null);

            const [activeTask, setActiveTask] = useState(null);
            const [studentName, setStudentName] = useState('');
            const [studentLevel, setStudentLevel] = useState('2º ESO');
            const [studentCustomLevel, setStudentCustomLevel] = useState('');
            const [studentLetter, setStudentLetter] = useState('');
            const studentClass = useMemo(() => {
                const level = studentLevel === '__custom__' ? studentCustomLevel.trim() : studentLevel;
                const letter = studentLetter.trim().toUpperCase();
                return [level, letter].filter(Boolean).join(' ');
            }, [studentLevel, studentCustomLevel, studentLetter]);
            const groupComplete = !!studentLetter.trim() && (studentLevel !== '__custom__' || !!studentCustomLevel.trim());
            const [studentEmail, setStudentEmail] = useState('');
            const [studentAnswers, setStudentAnswers] = useState({});
            const [usedHints, setUsedHints] = useState({});
            const [finalScoreRecord, setFinalScoreRecord] = useState(null);
            const [examSubmitted, setExamSubmitted] = useState(false);
            const [alreadySubmittedWarning, setAlreadySubmittedWarning] = useState(false);

            const [mcOptions, setMcOptions] = useState({});
            const [speakingIndex, setSpeakingIndex] = useState(null);
            const [projection, setProjection] = useState(null);
            const [projectionScale, setProjectionScale] = useState(1);
            const [projectionVideoSmall, setProjectionVideoSmall] = useState(false);
            const [revealedGaps, setRevealedGaps] = useState({});
            const [focusMode, setFocusMode] = useState(false);
            const [focusPar, setFocusPar] = useState(0);

            // SISTEMA ANTI-COPIA Y AVISO DE PESTAÑA
            useEffect(() => {
                if (view !== 'student-test' || examSubmitted) return;

                const handleCopy = (e) => {
                    e.preventDefault();
                    showToast("⚠️ El texto está protegido. Busca las respuestas en tus apuntes o en un diccionario de música.", "error");
                };
                
                const handleContextMenu = (e) => {
                    e.preventDefault();
                    showToast("⚠️ El botón derecho está desactivado. El texto está protegido.", "error");
                };

                const handleVisibilityChange = () => {
                    if (document.hidden && view === 'student-test' && !examSubmitted && activeTask) {
                        setShowAwayWarning(true);
                    }
                };

                document.addEventListener('copy', handleCopy);
                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener("visibilitychange", handleVisibilityChange);

                return () => {
                    document.removeEventListener('copy', handleCopy);
                    document.removeEventListener('contextmenu', handleContextMenu);
                    document.removeEventListener("visibilitychange", handleVisibilityChange);
                };
            }, [view, examSubmitted, activeTask]);

            useEffect(() => {
                if (darkMode) document.body.classList.add('dark');
                else document.body.classList.remove('dark');
                localStorage.setItem('audition_dark_mode', darkMode);
            }, [darkMode]);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 5000);
            };

            const copyToClipboard = (text) => {
                const tempInput = document.createElement("input");
                tempInput.value = text;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
            };

            useEffect(() => {
                if (supabaseUrl && supabaseKey && window.supabase) {
                    try {
                        const client = window.supabase.createClient(supabaseUrl, supabaseKey);
                        setSupabaseClient(client);
                    } catch (e) {
                        console.error("Supabase init error:", e);
                        setSupabaseClient(null);
                    }
                }
            }, [supabaseUrl, supabaseKey]);

            const toggleSpeech = (text, index) => {
                if ('speechSynthesis' in window) {
                    if (speakingIndex === index) { window.speechSynthesis.cancel(); setSpeakingIndex(null); }
                    else {
                        window.speechSynthesis.cancel();
                        const cleanText = text.replace(/[A-ZÁÉÍÓÚÑ]{2,}/g, (m) => m.toLowerCase());
                        const utterance = new SpeechSynthesisUtterance(cleanText);
                        utterance.lang = 'es-ES'; utterance.rate = 0.95;
                        const voices = window.speechSynthesis.getVoices();
                        const spanishVoice = voices.find(v => v.lang === 'es-ES') || voices.find(v => v.lang.startsWith('es'));
                        if (spanishVoice) utterance.voice = spanishVoice;
                        utterance.onend = () => setSpeakingIndex(null);
                        utterance.onerror = () => setSpeakingIndex(null);
                        setSpeakingIndex(index);
                        window.speechSynthesis.speak(utterance);
                    }
                } else showToast("La lectura en voz alta no está disponible en este navegador.", "error");
            };

            const loadStudentTask = async (code) => {
                if (!code) return;
                setLoading(true);
                let taskData = null;
                try {
                    const c = window.supabase.createClient(supabaseUrl, supabaseKey, { auth: { persistSession: false } });
                    const { data, error } = await c.rpc('get_audition_public', { p_code: code });
                    if (error) console.error(error); else taskData = data;
                } catch (e) { console.error(e); }
                if (taskData) { setActiveTask(taskData); setExamSubmitted(false); setFinalScoreRecord(null); setView('student-test'); }
                else { showToast("No se encuentra la tarea. Pide a tu profesor o profesora un enlace nuevo.", "error"); setActiveTask(null); setView('student-test'); }
                setLoading(false);
            };

            useEffect(() => {
                setLoading(false);
            }, []);

            useEffect(() => {
                const code = getTaskCodeFromUrl();
                if (code) {
                    if (window.location.hash && window.location.hash.startsWith('#task/')) {
                        try { window.history.replaceState(null, '', buildStudentUrl(code)); } catch (e) {}
                    }
                    loadStudentTask(code);
                }
            }, []);

            useEffect(() => {
                const code = getTaskCodeFromUrl();
                if (!code && session && view === 'auth') setView('dashboard');
            }, [session, view]);

            useEffect(() => {
                if (activeTask && activeTask.mc_options && view === 'student-test' && !examSubmitted) setMcOptions(activeTask.mc_options);
            }, [activeTask, view, examSubmitted]);

            useEffect(() => {
                if (!supabaseClient) return;
                supabaseClient.auth.getSession().then(({ data }) => { if (data?.session) setSession(data.session); });
                const { data: sub } = supabaseClient.auth.onAuthStateChange((event, sess) => {
                    setSession(sess);
                    if (event === 'PASSWORD_RECOVERY') {
                        setRecoveryPassword('');
                        setRecoveryPasswordConfirm('');
                        setView('reset-password');
                    }
                });
                return () => sub.subscription.unsubscribe();
            }, [supabaseClient]);

            const handleTeacherAuth = async (e) => {
                e.preventDefault();
                const normalizedEmail = authEmail.trim().toLowerCase();
                if (!supabaseClient) {
                    showToast("No hay conexión con la nube. Recarga la página e inténtalo de nuevo.", "error");
                    return;
                }
                if (!normalizedEmail || !authPassword) {
                    showToast("Escribe tu correo y tu contraseña.", "error");
                    return;
                }
                if (authMode === 'signup' && authPassword.length < 10) {
                    showToast("Elige una contraseña de al menos 10 caracteres.", "error");
                    return;
                }
                setLoading(true);
                try {
                    if (authMode === 'signup') {
                        const { data, error } = await supabaseClient.auth.signUp({
                            email: normalizedEmail,
                            password: authPassword
                        });
                        if (error) throw error;
                        if (data.session) {
                            setSession(data.session);
                            setView('dashboard');
                            showToast("Cuenta creada correctamente.", "success");
                        } else {
                            showToast("Cuenta creada. Revisa tu correo para confirmarla y después entra.", "success");
                            setAuthMode('signin');
                        }
                    } else {
                        const { data, error } = await supabaseClient.auth.signInWithPassword({
                            email: normalizedEmail,
                            password: authPassword
                        });
                        if (error) throw error;
                        setSession(data.session);
                        setView('dashboard');
                        showToast("Has entrado correctamente.", "success");
                    }
                } catch (error) {
                    console.error("Teacher authentication error:", error);
                    showToast(error?.message || "No se ha podido entrar. Revisa tu correo y tu contraseña.", "error");
                } finally {
                    setLoading(false);
                }
            };

            const handlePasswordRecoveryRequest = async () => {
                const normalizedEmail = authEmail.trim().toLowerCase();
                if (!supabaseClient) { showToast('No hay conexión con la nube. Recarga la página e inténtalo de nuevo.', 'error'); return; }
                if (!normalizedEmail) { showToast('Escribe primero tu correo.', 'error'); return; }
                setLoading(true);
                try {
                    const redirectTo = `${window.location.origin}${window.location.pathname}`;
                    const { error } = await supabaseClient.auth.resetPasswordForEmail(normalizedEmail, { redirectTo });
                    if (error) throw error;
                    showToast('Te hemos enviado un correo para recuperar la contraseña. Abre el más reciente para continuar.', 'success');
                } catch (error) {
                    showToast(error?.message || 'No se ha podido enviar el correo de recuperación.', 'error');
                } finally { setLoading(false); }
            };

            const handleSetNewPassword = async (e) => {
                e.preventDefault();
                if (!supabaseClient) { showToast('No hay conexión con la nube. Recarga la página e inténtalo de nuevo.', 'error'); return; }
                if (!session) { showToast('No se ha cargado la sesión de recuperación. Pide un correo de recuperación nuevo.', 'error'); setView('auth'); return; }
                if (recoveryPassword.length < 10) { showToast('Elige una contraseña de al menos 10 caracteres.', 'error'); return; }
                if (recoveryPassword !== recoveryPasswordConfirm) { showToast('Las contraseñas no coinciden.', 'error'); return; }
                setLoading(true);
                try {
                    const { error } = await supabaseClient.auth.updateUser({ password: recoveryPassword });
                    if (error) throw error;
                    setRecoveryPassword(''); setRecoveryPasswordConfirm(''); setAuthPassword('');
                    try { window.history.replaceState(null, '', `${window.location.origin}${window.location.pathname}`); } catch (e) {}
                    setView('dashboard');
                    showToast('Contraseña cambiada. Ya puedes salir y entrar con la nueva.', 'success');
                } catch (error) {
                    showToast(error?.message || 'No se ha podido cambiar la contraseña.', 'error');
                } finally { setLoading(false); }
            };

            const handleLogout = async () => {
                try { await supabaseClient.auth.signOut(); } catch (e) {}
                setSession(null); setView('auth');
                showToast("Has salido de tu cuenta.", "info");
            };


            const videoId = useMemo(() => extractYouTubeId(youtubeUrl), [youtubeUrl]);
            const uppercaseWords = useMemo(() => commentText.match(/[A-ZÁÉÍÓÚÑ]{2,}/g) || [], [commentText]);
            // Avisos: cosas que la app contaría mal como huecos.
            const commentWarnings = useMemo(() => {
                const w = [];
                const roman = (commentText.match(/\b[IVXLCDM]{2,}\b/g) || []);
                if (roman.length) w.push(`Parece que hay números romanos en mayúscula (${[...new Set(roman)].join(', ')}). Escríbelos en minúscula: «siglo xx».`);
                const withU = (commentText.match(/[A-ZÁÉÍÓÚÑ]*Ü[A-ZÁÉÍÓÚÑÜ]*/g) || []).filter(x => x.length > 1);
                if (withU.length) w.push(`Las palabras con Ü no funcionan como hueco (${[...new Set(withU)].join(', ')}). Escríbelas en minúscula.`);
                const hyph = (commentText.match(/[A-ZÁÉÍÓÚÑ]+[-&][A-ZÁÉÍÓÚÑ]+/g) || []);
                if (hyph.length) w.push(`Las palabras con guion o símbolos cuentan mal (${[...new Set(hyph)].join(', ')}). Pon en mayúscula solo una parte o elige otra palabra.`);
                return w;
            }, [commentText]);
            const activeMusicTheme = getMusicTheme(activeTask?.style || 'classical');

            const handleHintChange = (idx, value) => {
                const newHints = [...taskHints]; newHints[idx] = value; setTaskHints(newHints);
            };

            const handlePublishTask = async () => {
                if (uppercaseWords.length !== 10) { showToast("El comentario debe tener exactamente 10 palabras en MAYÚSCULAS.", "error"); return; }
                if (!videoId) { showToast("Pon un enlace válido de YouTube.", "error"); return; }
                const teacherEmail = session?.user?.email?.toLowerCase().trim();
                if (!teacherEmail) { showToast("Entra en tu cuenta antes de publicar.", "error"); setView('auth'); return; }
                if (!supabaseClient) { showToast("No hay conexión con Supabase. La tarea no se ha publicado.", "error"); return; }
                setLoading(true);
                const taskId = SHARE_PREFIX + crypto.randomUUID().replace(/-/g, '').slice(0, 16);

                    teacher_email: teacherEmail,
                    title: title || 'Audición sin título',
                    artist: artist || 'Artista desconocido',
                    style: style,
                    youtube_url: youtubeUrl,
                    comment: commentText,
                    uppercase_words: uppercaseWords,
                    hints: taskHints.slice(0, 10),

                    is_exam_mode: false,
                    created_at: new Date().toISOString()
                };
                try {
                    let insertError = null;
                    const firstTry = await supabaseClient.from('auditions').insert([taskPayload]);
                    insertError = firstTry.error;
                    if (insertError && /hints/i.test(insertError.message || '')) {
                        const { hints, ...payloadNoHints } = taskPayload;
                        const retry = await supabaseClient.from('auditions').insert([payloadNoHints]);
                        insertError = retry.error;
                    }
                    if (insertError) {
                        console.error("Supabase insert error:", insertError);

                        setLoading(false);
                        return;

                } catch (e) {
                    console.error("Supabase publish exception:", e);
                    showToast("No se ha podido guardar la audición. No se ha creado ningún enlace para el alumnado.", "error");
                    setLoading(false);
                    return;
                }
                taskPayload.id = taskId;
                const currentList = getStoredAuditions();

                showToast("Audición guardada en la nube.", "success");
                setLoading(false);

            const fetchHistoryAndScores = async () => {
                if (!session?.user?.email) return;
                const teacherEmail = session.user.email.toLowerCase().trim();
                const localAuds = getStoredAuditions().filter(a => (a.teacher_email || a.teacher_id)?.toLowerCase() === teacherEmail && String(a.share_link || '').startsWith(SHARE_PREFIX));
                setAuditionsList(localAuds);
                const localScores = getStoredScores().filter(s => (s.teacher_email || s.taskDetails?.teacher_email)?.toLowerCase() === teacherEmail && String(s.audition_id || '').startsWith(SHARE_PREFIX));
                setScoresList(localScores);
                if (supabaseClient) {
                    try {
                        const { data: cloudAuds, error: audErr } = await supabaseClient.from('auditions').select('*').eq('teacher_email', teacherEmail).like('share_link', SHARE_PREFIX + '%').order('created_at', { ascending: false });
                        if (cloudAuds && !audErr) setAuditionsList(cloudAuds);
                        const { data: cloudScores, error: scErr } = await supabaseClient.from('student_submissions').select('*').eq('teacher_email', teacherEmail).like('audition_id', SHARE_PREFIX + '%').order('created_at', { ascending: false });
                        if (cloudScores && !scErr) setScoresList(cloudScores);
                    } catch (e) { console.error("Fetch Supabase Cloud error:", e); }
                }
            };

            useEffect(() => { if (view === 'dashboard') fetchHistoryAndScores(); }, [view, dashboardTab, session, supabaseClient]);

            const handleCopyLink = (shareLink, id) => {
                copyToClipboard(buildStudentUrl(shareLink));
                setCopiedId(id); showToast("¡Enlace copiado!", "success");
                setTimeout(() => setCopiedId(null), 2000);
            };

            const handleDeleteAudition = async (id, shareLink) => {
                setConfirmModal({
                    title: "Eliminar audición",
                    message: "¿Seguro que quieres eliminar esta audición? También se borrará de la nube.",
                    onConfirm: async () => {
                        setConfirmModal(null);
                        const updated = auditionsList.filter(a => a.id !== id && a.share_link !== shareLink);
                        saveStoredAuditions(updated); setAuditionsList(updated);
                        if (supabaseClient) {
                            try {
                                if (shareLink) await supabaseClient.from('auditions').delete().eq('share_link', shareLink);
                                else await supabaseClient.from('auditions').delete().eq('id', id);
                            } catch (e) { console.error("Delete error:", e); }
                        }
                        showToast("Audición eliminada.", "info");
                    }
                });
            };

            const handleDeleteScore = async (id) => {
                setConfirmModal({
                    title: "Eliminar resultado",
                    message: "¿Seguro que quieres eliminar este resultado? También se borrará de la nube.",
                    onConfirm: async () => {
                        setConfirmModal(null);
                        const updated = scoresList.filter(s => s.id !== id);
                        saveStoredScores(updated); setScoresList(updated);
                        if (supabaseClient) {
                            try { await supabaseClient.from('student_submissions').delete().eq('id', id); } catch (e) { console.error(e); }
                        }
                        showToast("Resultado eliminado.", "info");
                    }
                });
            };

            // Corrige el nombre o el grupo de UNA entrega (lo que el alumno escribió mal)
            const handleEditScore = async (id, patch) => {
                if (supabaseClient) {
                    try {
                        const { data, error } = await supabaseClient.from('student_submissions').update(patch).eq('id', id).select('id');
                        if (error || !data || data.length === 0) throw new Error(error?.message || 'RLS');
                    } catch (e) { showToast("No se ha podido guardar el cambio: " + (e.message || ''), "error"); return false; }
                }
                const updated = scoresList.map(s => s.id === id ? { ...s, ...patch } : s);
                setScoresList(updated);
                try { saveStoredScores(getStoredScores().map(s => s.id === id ? { ...s, ...patch } : s)); } catch (e) {}
                showToast("Entrega corregida.", "success");
                return true;
            };

            const handleDeleteAllTasks = () => {
                setDeleteAllConfirmText('');
                setDeleteAllModal({
                    title: "BORRAR TODAS LAS AUDICIONES",
                    message: "Se borrarán para siempre TODAS tus audiciones en castellano, de este navegador y de Supabase. No se puede deshacer. Las audiciones de la versión en inglés no se tocan.",
                    danger: true,
                    onConfirm: async () => {
                        setDeleteAllModal(null);
                        saveStoredAuditions([]);
                        setAuditionsList([]);
                        const teacherEmail = session?.user?.email?.toLowerCase().trim();
                        if (supabaseClient && teacherEmail) {
                            try { await supabaseClient.from('auditions').delete().eq('teacher_email', teacherEmail).like('share_link', SHARE_PREFIX + '%'); } catch (e) { console.error(e); }
                        }
                        showToast("Todas las audiciones borradas.", "info");
                    }
                });
            };

            const handleDeleteAllScores = () => {
                setDeleteAllConfirmText('');
                setDeleteAllModal({
                    title: "BORRAR TODOS LOS RESULTADOS",
                    message: "Se borrarán para siempre TODOS los resultados del alumnado de tus audiciones en castellano, de este navegador y de Supabase. No se puede deshacer. Úsalo al final del curso.",
                    danger: true,
                    onConfirm: async () => {
                        setDeleteAllModal(null);
                        saveStoredScores([]);
                        setScoresList([]);
                        const teacherEmail = session?.user?.email?.toLowerCase().trim();
                        if (supabaseClient && teacherEmail) {
                            try { await supabaseClient.from('student_submissions').delete().eq('teacher_email', teacherEmail).like('audition_id', SHARE_PREFIX + '%'); } catch (e) { console.error(e); }
                        }
                        showToast("Todos los resultados borrados.", "info");
                    }
                });
            };

            const handleStudentLookup = async (e) => {
                e.preventDefault(); if (!lookupEmail.trim()) return;
                setLoading(true);
                let matched = null;
                try {
                    const { data } = await supabaseClient.rpc('lookup_submission', { p_code: activeTask?.share_link, p_email: lookupEmail.trim().toLowerCase() });
                    if (data) matched = hydrateRecord(data, activeTask);
                } catch (err) { console.error(err); }
                if (matched) {
                    setFinalScoreRecord(matched); setExamSubmitted(true); setView('results'); setLookupModal(false);
                    showToast("¡Resultado recuperado!", "success");
                } else showToast("No hay ningún envío con este correo en esta tarea.", "error");
                setLoading(false);
            };


            const filteredScores = useMemo(() => {
                return scoresList.filter(s => {
                    const qRaw = String(searchTerm || '').trim();
                    const q = normalizeSearch(qRaw);
                    if (!q) return true;

                    // A lone 1, 2 or 3 prioritises the course; a lone 4 is a score search.
                    if (/^[1-3]$/.test(q)) return classSearchMatch(s.student_class, q);
                    if (q === '4') return String(s.score ?? '').includes(q);
                    // A lone group letter searches that group across all course levels.
                    if (/^[a-d]$/.test(q)) return classSearchMatch(s.student_class, q);
                    // Explicit course/group queries such as 2A, 2 ESO A, 4ESO, 4curso or 4ABC.
                    if (/^\d+(?:eso|curso|bachillerato|bach)?[a-z]*$/.test(q)) {
                        return classSearchMatch(s.student_class, q);
                    }

                    const fields = [
                        normalizeSearch(s.student_name),
                        normalizeSearch(s.student_email),
                        normalizeSearch(s.student_class),
                        normalizeSearch(s.auditions?.title),
                        normalizeSearch(s.auditions?.artist),
                        String(s.score),
                        formatScore(s.score)
                    ];
                    return fields.some(f => f.includes(q));
                });
            }, [scoresList, searchTerm]);

            const filteredAuditions = useMemo(() => {
                return auditionsList.filter(a => {
                    const q = normalizeSearch(searchTermHistory);
                    if (!q) return true;
                    const fields = [
                        normalizeSearch(a.title),
                        normalizeSearch(a.artist),
                        normalizeSearch(a.share_link)
                    ];
                    return fields.some(f => f.includes(q));
                });
            }, [auditionsList, searchTermHistory]);

            const stats = useMemo(() => {
                if (filteredScores.length === 0) return null;
                const avg = filteredScores.reduce((acc, s) => acc + Number(s.score || 0), 0) / filteredScores.length;
                const best = filteredScores.reduce((acc, s) => Number(s.score) > Number(acc.score) ? s : acc, filteredScores[0]);
                return { avg: avg.toFixed(2).replace('.', ','), count: filteredScores.length, bestName: best.student_name, bestScore: formatScore(best.score) };
            }, [filteredScores]);

            const parsedParagraphs = useMemo(() => {
                if (!activeTask?.comment) return [];
                let gapCounter = 0;
                const paragraphs = activeTask.comment.split('\n');
                return paragraphs.map((paragraphText) => {
                    if (!paragraphText.trim()) return [];
                    const tokens = []; const regex = /([A-ZÁÉÍÓÚÑ]{2,})/g;
                    let lastIdx = 0; let match;
                    while ((match = regex.exec(paragraphText)) !== null) {
                        if (match.index > lastIdx) tokens.push({ type: 'text', content: paragraphText.slice(lastIdx, match.index) });
                        tokens.push({ type: 'gap', word: match[0], gapIndex: gapCounter++ });
                        lastIdx = regex.lastIndex;
                    }
                    if (lastIdx < paragraphText.length) tokens.push({ type: 'text', content: paragraphText.slice(lastIdx) });
                    return tokens;
                });
            }, [activeTask]);

            const handleStudentAnswerChange = (idx, value) => { setStudentAnswers(prev => ({ ...prev, [idx]: value })); };

            const checkIfAlreadySubmitted = async (email) => {
                if (!email.trim() || !activeTask) return false;
                const taskUniqueId = activeTask.share_link || activeTask.id;
                const cleanEmail = email.toLowerCase().trim();
                if (supabaseClient) {
                    try {
                        const { data } = await supabaseClient.from('student_submissions').select('id').eq('student_email', cleanEmail).eq('audition_id', taskUniqueId).limit(1);
                        if (data && data.length > 0) return true;
                    } catch (e) {}
                }
                const local = getStoredScores();
                return local.some(s => s.student_email?.toLowerCase() === cleanEmail && s.audition_id === taskUniqueId);
            };

            const handleEvaluation = async () => {
                if (submitting) return;
                if (!supabaseClient) { showToast('El servidor no está disponible. Tus respuestas no se han enviado.', 'error'); return; }
                if (!studentName.trim() || !studentEmail.trim() || !groupComplete) { showToast("Escribe tu nombre completo, tu curso con la letra del grupo y tu correo del centro.", "error"); return; }
                if (!/@(alu\.)?murciaeduca\.es$/i.test(studentEmail.trim())) { showToast("Tienes que usar tu correo del centro, el que termina en @alu.murciaeduca.es.", "error"); return; }
                setSubmitting(true);
                try {
                    const { data, error } = await supabaseClient.rpc('submit_audition', {
                        p_code: activeTask.share_link, p_name: studentName.trim(), p_class: studentClass,
                        p_email: studentEmail.trim().toLowerCase(), p_answers: studentAnswers, p_hints: usedHints
                    });
                    if (error) {
                        showToast(/already_submitted/.test(error.message) ? "Ya has enviado esta tarea con este correo. Pulsa «¿Ya la has hecho?» para ver tu resultado." : /invalid_email/.test(error.message) ? "Tienes que usar tu correo del centro, el que termina en @alu.murciaeduca.es." : "No se ha podido guardar tu nota: " + error.message, "error");
                        return;
                    }
                    const record = hydrateRecord(data, activeTask);
                    const finalGrade = Number(record.score);
                    setFinalScoreRecord(record); setExamSubmitted(true); setView('results');
                    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                    if (finalGrade >= 5) {
                        playAudioFeedback('success', finalGrade);
                        if (finalGrade >= 8 && window.confetti) confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                    } else playAudioFeedback('error', finalGrade);
                } finally { setSubmitting(false); }
            };


            // ---------- PDF: FICHA PARA EL ALUMNADO (PÁGINA 1) + SOLUCIONES (PÁGINA APARTE) ----------
            const GRANATE = [122, 31, 61];
            const DORADO = [214, 160, 64];
            const TEXTO = [51, 65, 85];

            const drawFrame = (doc) => {
                doc.setDrawColor(...GRANATE); doc.setLineWidth(1.1); doc.rect(8, 8, 194, 281);
                doc.setDrawColor(...DORADO); doc.setLineWidth(0.4); doc.rect(10.5, 10.5, 189, 276);

                doc.setFillColor(...DORADO);
                [[10.5, 10.5], [199.5, 10.5], [10.5, 286.5], [199.5, 286.5]].forEach(([x, y]) => doc.rect(x - 1.2, y - 1.2, 2.4, 2.4, 'F'));
            };

            const drawBrand = (doc, rightLabel) => {

                doc.setDrawColor(...DORADO); doc.setLineWidth(0.5); doc.line(18, 26, 192, 26);

            const drawTitleBlock = (doc, audition, y) => {
                doc.setFont("Helvetica", "bold"); doc.setTextColor(15, 23, 42);

                doc.setFont("Helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(71, 85, 105);
                doc.text(String(audition.artist || ''), 105, y + 6, { align: 'center', maxWidth: 170 });

            const drawQrBlock = async (doc, url, y) => {
                const label = "ESCUCHA LA AUDICIÓN";

            const drawStudentSheet = async (doc, audition) => {
                drawFrame(doc);
                drawBrand(doc, '');
                drawTitleBlock(doc, audition, 34);

                // Cabecera: nombre, grupo y nota
                doc.setFillColor(251, 243, 245); doc.setDrawColor(...GRANATE); doc.setLineWidth(0.35);
                doc.roundedRect(20, 45, 170, 11, 2, 2, 'FD');
                doc.setFont("Helvetica", "bold"); doc.setFontSize(7.5); doc.setTextColor(...GRANATE);
