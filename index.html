                doc.text("GRUPO:", 122, 52);
                doc.text("NOTA:", 150, 52);
                doc.setDrawColor(148, 163, 184); doc.setLineWidth(0.3);
                doc.line(56, 52.5, 119, 52.5);
                doc.line(133, 52.5, 147, 52.5);
                doc.line(160, 52.5, 174, 52.5);
                doc.setFont("Helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(15, 23, 42);
                doc.text("/ 10", 176, 52.5);

                doc.setFont("Helvetica", "italic"); doc.setFontSize(8); doc.setTextColor(71, 85, 105);
                doc.text("Escucha la audición y completa los huecos. En los huecos con opciones, rodea la palabra correcta.", 105, 62, { align: 'center' });

                const paragraphs = tokenizeAudition(audition).map(tokens => tokens.map(t => t.type === 'gap' ? gapToPrint(t) : t.content).join(''));
                const fullText = paragraphs.join('\n').replace(/\n{3,}/g, '\n\n').trim();

                const hints = (Array.isArray(audition.hints) ? audition.hints : [])
                    .map((h, i) => ({ n: i + 1, text: String(h || '').trim() }))
                    .filter(h => h.text);
                doc.setFont("Helvetica", "normal"); doc.setFontSize(8.5);
                const hintLines = hints.map(h => doc.splitTextToSize(`Hueco ${h.n}: ${h.text}`, 158));
                const hintLh = 8.5 * PT_TO_MM * 1.35;
                const hintsHeight = hints.length ? 12 + hintLines.reduce((acc, l) => acc + l.length * hintLh + 1.2, 0) : 0;

                const textTop = 68;
                const bottomLimit = audition.youtube_url ? 252 : 282;
                const textBottom = bottomLimit - (hints.length ? hintsHeight + 4 : 0);
                doc.setFont("Helvetica", "normal");
                const fit = fitTextBlock(doc, fullText, 170, textBottom - textTop, 11, 7.5);
                doc.setFontSize(fit.size); doc.setTextColor(...TEXTO);

                let y = textTop + fit.size * PT_TO_MM;
                let limit = fit.fits ? textBottom : 280;
                fit.lines.forEach(line => {
                    if (y > limit) { doc.addPage(); drawFrame(doc); y = 22; limit = 280; doc.setFont("Helvetica", "normal"); doc.setFontSize(fit.size); doc.setTextColor(...TEXTO); }
                    doc.text(line, 20, y);
                    y += fit.lh;
                });

                let hintsY = textBottom + 4;
                let qrY = 256;
                if (!fit.fits) {
                    const needed = (hints.length ? hintsHeight + 4 : 0) + (audition.youtube_url ? 31 : 0);
                    if (y + needed > 284) { doc.addPage(); drawFrame(doc); y = 18; }
                    hintsY = y + 2;
                    qrY = hintsY + (hints.length ? hintsHeight + 4 : 0);
                }

                if (hints.length) {
                    doc.setDrawColor(...DORADO); doc.setFillColor(253, 248, 236); doc.setLineWidth(0.4);
                    doc.roundedRect(20, hintsY, 170, hintsHeight, 2, 2, 'FD');
                    doc.setFont("Helvetica", "bold"); doc.setFontSize(8.5); doc.setTextColor(...GRANATE);
                    doc.text("PISTAS", 24, hintsY + 5.5);
                    doc.setFont("Helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(120, 80, 30);
                    doc.text("Si usas una pista, marca su casilla: ese acierto valdrá 0,5 puntos en lugar de 1.", 40, hintsY + 5.5);
                    let hy = hintsY + 11;
                    doc.setFontSize(8.5); doc.setTextColor(...TEXTO);
                    hints.forEach((h, i) => {
                        doc.setDrawColor(...GRANATE); doc.setLineWidth(0.3);
                        doc.rect(24, hy - 2.8, 3.2, 3.2);
                        doc.text(hintLines[i], 30, hy);
                        hy += hintLines[i].length * hintLh + 1.2;
                    });
                }

                if (audition.youtube_url) await drawQrBlock(doc, audition.youtube_url, qrY);
            };

            const drawSolutionsSheet = (doc, audition) => {
                drawFrame(doc);
                drawBrand(doc, 'SOLUCIONES · solo para el profesorado');
                drawTitleBlock(doc, audition, 34);

                const words = getAuditionWords(audition);
                doc.setFillColor(253, 248, 236); doc.setDrawColor(...DORADO); doc.setLineWidth(0.4);
                doc.roundedRect(20, 46, 170, 54, 2, 2, 'FD');
                words.slice(0, 10).forEach((w, i) => {
                    const col = i < 5 ? 0 : 1;
                    const x = col ? 110 : 26;
                    const yy = 56 + (i % 5) * 9.5;
                    doc.setFont("Helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...GRANATE);
                    doc.text(`${i + 1}.`, x, yy);
                    doc.setTextColor(15, 23, 42);
                    doc.text(w, x + 8, yy);
                    const ww = doc.getTextWidth(w);
                    if (i === 2 || i === 7) {
                        doc.setFont("Helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(100, 116, 139);
                        doc.text("(opción múltiple)", x + 10 + ww, yy);
                    }
                });

                doc.setFont("Helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(71, 85, 105);
                doc.text("Cada acierto vale 1 punto. Si el alumno ha marcado la pista de ese hueco, vale 0,5. Se aceptan las respuestas con o sin tilde.", 105, 107, { align: 'center', maxWidth: 170 });

                doc.setFont("Helvetica", "bold"); doc.setFontSize(8.5); doc.setTextColor(...GRANATE);
                doc.text("TEXTO COMPLETO", 20, 117);
                doc.setDrawColor(...DORADO); doc.setLineWidth(0.3); doc.line(20, 119, 190, 119);

                const fullText = String(audition.comment || '').replace(/\n{3,}/g, '\n\n').trim();
                doc.setFont("Helvetica", "normal");
                const fit = fitTextBlock(doc, fullText, 170, 282 - 124, 10.5, 7.5);
                doc.setFontSize(fit.size); doc.setTextColor(...TEXTO);
                let y = 124 + fit.size * PT_TO_MM;
                fit.lines.forEach(line => {
                    if (y > 282) { doc.addPage(); drawFrame(doc); y = 22; doc.setFont("Helvetica", "normal"); doc.setFontSize(fit.size); doc.setTextColor(...TEXTO); }
                    doc.text(line, 20, y);
                    y += fit.lh;
                });
            };

            // Un solo PDF: la ficha del alumnado y, en una hoja aparte, las soluciones.
            const downloadAuditionTemplatePDF = async (audition) => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                await drawStudentSheet(doc, audition);
                doc.addPage();
                drawSolutionsSheet(doc, audition);
                openPdf(doc, `ficha_${safeFileName(audition.title)}.pdf`);
            };

            useEffect(() => {
                if (!projection) return;
                const total = tokenizeAudition(projection).filter(t => t.length > 0).length;
                const onKey = (e) => {
                    if (e.key === 'Escape' && !document.fullscreenElement) { setProjection(null); return; }
                    if (!focusMode) return;
                    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); setFocusPar(p => Math.min(total - 1, p + 1)); }
                    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); setFocusPar(p => Math.max(0, p - 1)); }
                };
                document.addEventListener('keydown', onKey);
                return () => document.removeEventListener('keydown', onKey);
            }, [projection, focusMode]);

            useEffect(() => {
                if (!projection || !focusMode) return;
                const el = document.getElementById(`proj-par-${focusPar}`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, [projection, focusMode, focusPar]);

            const toggleFullscreen = () => {
                try {
                    if (document.fullscreenElement) document.exitFullscreen();
                    else document.documentElement.requestFullscreen();
                } catch (e) {}
            };

            return (
                <div className="min-h-screen pb-12">
                    {toast && (
                        <div className={`fixed bottom-6 right-6 z-50 px-5 py-3.5 rounded-xl shadow-2xl text-sm font-bold text-white flex items-center gap-2 ${toast.type === 'error' ? 'bg-rose-600' : toast.type === 'success' ? 'bg-emerald-600' : 'bg-indigo-600'}`}>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {confirmModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-100">
                                <h3 className="text-lg font-bold text-slate-900 mb-2">{confirmModal.title}</h3>
                                <p className="text-sm text-slate-600 mb-6">{confirmModal.message}</p>
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setConfirmModal(null)} className="px-4 py-2 rounded-xl text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200">Cancelar</button>
                                    <button onClick={confirmModal.onConfirm} className="px-4 py-2 rounded-xl text-sm font-bold text-white bg-rose-600 hover:bg-rose-700">Eliminar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {deleteAllModal && (
                        <div className="fixed inset-0 bg-rose-900/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border-2 border-rose-300">
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center text-rose-600 text-2xl">⚠️</div>
                                    <h3 className="text-xl font-black text-rose-700">{deleteAllModal.title}</h3>
                                </div>
                                <p className="text-sm text-slate-700 mb-4">{deleteAllModal.message}</p>
                                <p className="text-xs font-bold text-rose-600 mb-2">Escribe BORRAR para confirmar:</p>
                                <input
                                    type="text"
                                    value={deleteAllConfirmText}
                                    onChange={e => setDeleteAllConfirmText(e.target.value)}
                                    placeholder="BORRAR"
                                    className="w-full px-4 py-2.5 border-2 border-rose-300 rounded-xl text-sm outline-none focus:border-rose-600 font-bold uppercase"
                                    autoFocus
                                />
                                <div className="flex justify-end gap-2 mt-6">
                                    <button onClick={() => setDeleteAllModal(null)} className="px-4 py-2 rounded-xl text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200">Cancelar</button>
                                    <button
                                        onClick={deleteAllModal.onConfirm}
                                        disabled={deleteAllConfirmText.trim().toUpperCase() !== 'BORRAR'}
                                        className={`px-4 py-2 rounded-xl text-sm font-bold text-white transition-all ${deleteAllConfirmText.trim().toUpperCase() === 'BORRAR' ? 'bg-rose-600 hover:bg-rose-700' : 'bg-rose-300 cursor-not-allowed'}`}
                                    >Borrar todo para siempre</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {lookupModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-100 space-y-4">
                                <h3 className="text-lg font-bold text-slate-900">Recuperar mi resultado</h3>
                                <p className="text-xs text-slate-500">Escribe el correo del centro con el que enviaste la tarea para ver tu nota.</p>
                                <form onSubmit={handleStudentLookup} className="space-y-4">
                                    <input type="email" required placeholder="tu.correo@alu.murciaeduca.es" value={lookupEmail} onChange={e => setLookupEmail(e.target.value)} className="w-full px-4 py-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
                                    <div className="flex justify-end gap-2">
                                        <button type="button" onClick={() => setLookupModal(false)} className="px-4 py-2 rounded-xl text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200">Cancelar</button>
                                        <button type="submit" className="px-4 py-2 rounded-xl text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700">Ver resultado</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                                                                    onClick={(e) => { e.stopPropagation(); setRevealedGaps(prev => ({ ...prev, [t.index]: !prev[t.index] })); }}
                                                                    onKeyDown={(e) => { if (e.key === 'Enter') setRevealedGaps(prev => ({ ...prev, [t.index]: !prev[t.index] })); }}
                                                                    className="proj-gap cursor-pointer rounded-t" style={{ borderColor: shown ? '#15803d' : theme.colors.accent, backgroundColor: shown ? '#dcfce7' : 'transparent', color: shown ? '#15803d' : undefined }}>
                                                                    <span className="proj-num" style={{ color: shown ? '#15803d' : theme.colors.accent }}>{t.index + 1}</span>
                                                                    <span>{shown ? t.word : (t.clue.type === 'options' ? `[ ${t.clue.options.join(' / ')} ]` : t.clue.parts.join(' '))}</span>
                                                                </span>
                                                            );
                                                        })}
                                                    </p>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            );
                        })()}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
